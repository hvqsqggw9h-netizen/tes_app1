<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TES 科目1 過去問アプリ</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --correct: #16a34a;
      --wrong: #dc2626;
      --border: #e5e7eb;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc 48%, #ecfeff);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .badge {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(229,231,235,0.9);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .mode, .year-btn, .choice, .main-btn, .ghost-btn {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .mode:hover, .year-btn:hover, .choice:hover, .ghost-btn:hover {
      transform: translateY(-2px);
      border-color: #93c5fd;
      box-shadow: 0 10px 24px rgba(37, 99, 235, .1);
    }

    .mode strong {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .mode span, .year-btn span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .year-list {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .year-btn {
      text-align: center;
      font-weight: 800;
    }

    .hidden { display: none !important; }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-wrap {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 999px;
      transition: width .25s ease;
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pill {
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
    }

    .question {
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.55;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 20px;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-weight: 700;
      line-height: 1.55;
    }

    .choice-mark {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
    }

    .choice.correct {
      border-color: #86efac;
      background: #f0fdf4;
      color: #14532d;
    }

    .choice.wrong {
      border-color: #fecaca;
      background: #fef2f2;
      color: #7f1d1d;
    }

    .feedback {
      margin-top: 18px;
      border-radius: 20px;
      padding: 18px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .feedback h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .feedback p {
      margin: 0;
      line-height: 1.8;
      color: #374151;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .main-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 800;
      text-align: center;
    }

    .ghost-btn {
      font-weight: 800;
      text-align: center;
      background: white;
    }

    .result-score {
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 900;
      letter-spacing: -0.06em;
      margin: 8px 0 4px;
    }

    .result-note {
      color: var(--muted);
      line-height: 1.8;
      margin: 0 0 18px;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0;
    }

    .summary-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }

    .summary-item strong {
      display: block;
      font-size: 24px;
    }

    .summary-item span {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .app { padding: 16px; }
      header { align-items: flex-start; flex-direction: column; }
      .grid, .summary-box { grid-template-columns: 1fr; }
      .year-list { grid-template-columns: repeat(3, 1fr); }
      .card { padding: 18px; border-radius: 22px; }
      .topline { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="badge">TES Learning App</span>
        <h1>科目1 繊維に関する一般知識</h1>
        <p class="subtitle">まずは2020年の科目1を完成させ、その後2021〜2025年へ展開します。</p>
      </div>
    </header>

    <main>
      <section id="home" class="card">
        <span class="badge">STEP 1</span>
        <h2>2020年 科目1を学習</h2>
        <p class="subtitle">問1をA〜Lに分解し、1問ずつ解いて理解を積み上げる形式です。</p>
        <div class="grid">
          <button class="mode" onclick="startQuiz('2020年 問1')">
            <strong>2020年 問1を解く</strong>
            <span>繊維分類・絹・繊維物性・耐薬品性を学習</span>
          </button>
          <button class="mode" onclick="startQuiz('2020年 ランダム')">
            <strong>ランダム復習</strong>
            <span>2020年問1の12問をテンポよく確認</span>
          </button>
          <button class="mode" onclick="startQuiz('2020年 苦手復習')">
            <strong>苦手復習</strong>
            <span>今後、間違えた問題を保存して復習できるようにします</span>
          </button>
        </div>
      </section>

      <section id="yearSelect" class="card hidden">
        <span class="badge">YEAR</span>
        <h2>年度を選択</h2>
        <p class="subtitle">現在はUI確認用のサンプル問題で動作します。</p>
        <div class="year-list">
          <button class="year-btn" onclick="startQuiz('2020年')">2020</button>
          <button class="year-btn" disabled style="opacity:.45; cursor:not-allowed;">2021</button>
          <button class="year-btn" disabled style="opacity:.45; cursor:not-allowed;">2022</button>
          <button class="year-btn" disabled style="opacity:.45; cursor:not-allowed;">2023</button>
          <button class="year-btn" disabled style="opacity:.45; cursor:not-allowed;">2024</button>
          <button class="year-btn" disabled style="opacity:.45; cursor:not-allowed;">2025</button>
        </div>
        <div class="actions">
          <button class="ghost-btn" onclick="goHome()">戻る</button>
        </div>
      </section>

      <section id="quiz" class="card hidden">
        <div class="topline">
          <span id="modeLabel">2020年</span>
          <span id="countLabel">1 / 3</span>
        </div>
        <div class="progress-wrap"><div id="progress" class="progress"></div></div>
        <div class="question-meta">
          <span class="pill" id="yearPill">2020</span>
          <span class="pill" id="fieldPill">天然繊維</span>
          <span class="pill">科目1</span>
        </div>
        <p id="questionText" class="question"></p>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="actions">
          <button id="nextBtn" class="main-btn hidden" onclick="nextQuestion()">次の問題へ</button>
          <button class="ghost-btn" onclick="goHome()">ホームへ戻る</button>
        </div>
      </section>

      <section id="result" class="card hidden">
        <span class="badge">RESULT</span>
        <h2>学習結果</h2>
        <div id="scoreText" class="result-score">0 / 0</div>
        <p id="resultNote" class="result-note"></p>
        <div class="summary-box">
          <div class="summary-item"><strong id="totalNum">0</strong><span>出題数</span></div>
          <div class="summary-item"><strong id="correctNum">0</strong><span>正解数</span></div>
          <div class="summary-item"><strong id="rateNum">0%</strong><span>正答率</span></div>
        </div>
        <div class="actions">
          <button class="main-btn" onclick="restartQuiz()">もう一度解く</button>
          <button class="ghost-btn" onclick="goHome()">ホームへ戻る</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const questions = [
      {
        year: 2020,
        sourceQuestion: "問1-A",
        field: "繊維分類",
        question: "繊維は、天然繊維と、人工的に製造する［A］に分類される。［A］に入る語句として最も適切なものはどれか。",
        choices: ["合成繊維", "化学繊維", "無機繊維"],
        answer: 1,
        explanation: "正解は「化学繊維」。人工的に製造される繊維の総称として押さえます。合成繊維は化学繊維の一部です。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-B",
        field: "絹",
        question: "絹は、主として家蚕の繭から採取される繊維で、長さは［B］を超え、天然繊維では希少な長繊維である。［B］に入る語句はどれか。",
        choices: ["10m", "100m", "1,000m"],
        answer: 2,
        explanation: "正解は「1,000m」。絹は天然繊維では珍しいフィラメント、つまり長繊維として出題されやすいポイントです。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-C",
        field: "絹",
        question: "精練した絹の主成分は［C］である。［C］に入る語句として最も適切なものはどれか。",
        choices: ["ケラチン", "フィブロイン", "セリシン"],
        answer: 1,
        explanation: "正解は「フィブロイン」。セリシンは精練で除去される成分、ケラチンは羊毛などで押さえるタンパク質です。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-D",
        field: "繊維高分子",
        question: "絹は羊毛繊維と同じく、分子の主鎖に［D］を有している。［D］に入る結合はどれか。",
        choices: ["－CO・O－", "－O－", "－NH・CO－"],
        answer: 2,
        explanation: "正解は「－NH・CO－」。これはアミド結合で、タンパク質系繊維の理解に関係します。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-E",
        field: "繊維物性",
        question: "繊維の断面形状が真円形である場合、直径を1/3にすると曲げ剛性は［E］となる。［E］に入る値はどれか。",
        choices: ["1/9", "1/27", "1/81"],
        answer: 2,
        explanation: "正解は「1/81」。曲げ剛性は直径の4乗に比例するため、直径が1/3になると 1/3⁴ = 1/81 になります。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-F",
        field: "繊維物性",
        question: "繊維を細くすると、繊維集合体では隙間が細分化されることから［F］が向上する効果も得られる。［F］に入る語句はどれか。",
        choices: ["吸水性", "吸湿性", "染色性"],
        answer: 0,
        explanation: "正解は「吸水性」。細繊化により毛細管効果が高まり、水を吸い上げやすくなる点がポイントです。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-G",
        field: "複合繊維",
        question: "直接的に紡糸できる限界以下の細さの繊維を製造するために、［G］複合繊維による方法が開発されている。［G］に入る語句はどれか。",
        choices: ["サイドバイサイド型", "芯鞘型", "海島型"],
        answer: 2,
        explanation: "正解は「海島型」。海成分を溶解除去して、島成分を極細繊維として得る方法です。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-H",
        field: "熱的性質",
        question: "結晶化度の低い高分子、例えばアクリルなどでは［H］を超えると急激に軟化する。［H］に入る語句はどれか。",
        choices: ["ガラス転移温度", "融解温度", "分解温度"],
        answer: 0,
        explanation: "正解は「ガラス転移温度」。非晶部の分子運動が活発になり、硬い状態から軟らかい状態へ変わる温度です。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-I",
        field: "熱的性質",
        question: "結晶化度の高い高分子、例えばポリエステルなどでは［I］近くになると急激に軟化する。［I］に入る語句はどれか。",
        choices: ["ガラス転移温度", "融解温度", "分解温度"],
        answer: 1,
        explanation: "正解は「融解温度」。結晶性の高い高分子では、結晶部分が融ける温度付近で急激な軟化が起こります。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-J",
        field: "耐薬品性",
        question: "綿や麻は［J］に溶解する。［J］に入る薬品として最も適切なものはどれか。",
        choices: ["酸化銅アンモニア溶液", "ベンゼン", "エタノール"],
        answer: 0,
        explanation: "正解は「酸化銅アンモニア溶液」。綿や麻の主成分であるセルロースを溶かす溶剤として押さえます。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-K",
        field: "耐薬品性",
        question: "絹は［K］に溶解する。［K］に入る薬品として最も適切なものはどれか。",
        choices: ["35％塩酸水溶液", "キシレン", "アセトン"],
        answer: 0,
        explanation: "正解は「35％塩酸水溶液」。絹はタンパク質系繊維であり、強酸に対する性質が問われています。"
      },
      {
        year: 2020,
        sourceQuestion: "問1-L",
        field: "耐薬品性",
        question: "アクリルは40〜50℃の［L］に溶解する。［L］に入る薬品として最も適切なものはどれか。",
        choices: ["氷酢酸", "ジメチルホルムアミド", "5％水酸化ナトリウム水溶液"],
        answer: 1,
        explanation: "正解は「ジメチルホルムアミド」。アクリルの溶剤としてDMFを覚えておくと、耐薬品性の問題で対応しやすくなります。"
      },
      {
        year: 2020,
        sourceQuestion: "問2-A",
        field: "比強度",
        question: "通常の衣料用繊維の場合、綿・レーヨン・ポリエステルを比強度の大きい順に並べたものとして最も適切なのはどれか。",
        choices: [
          "綿 ＞ レーヨン ＞ ポリエステル",
          "綿 ＞ ポリエステル ＞ レーヨン",
          "レーヨン ＞ 綿 ＞ ポリエステル",
          "ポリエステル ＞ 綿 ＞ レーヨン"
        ],
        answer: 3,
        explanation: "正解は『ポリエステル ＞ 綿 ＞ レーヨン』。ポリエステルは合成繊維で強度が高く、レーヨンは湿潤時に強度低下しやすい点も重要です。"
      },
      {
        year: 2020,
        sourceQuestion: "問2-B",
        field: "吸湿性",
        question: "繊維の水分率（％）を表す式として最も適切なものはどれか。",
        choices: [
          "〔（W－W′）／W〕×100",
          "〔（W－W′）／W′〕×100",
          "〔（W′－W）／W′〕×100"
        ],
        answer: 1,
        explanation: "正解は『〔（W－W′）／W′〕×100』。Wは乾燥前質量、W′は絶乾状態質量です。TESでは公式暗記だけでなく、意味理解も重要です。"
      },
      {
        year: 2020,
        sourceQuestion: "問2-C",
        field: "吸湿性",
        question: "羊毛・ナイロン・アクリルを、標準状態における水分率の高い順に並べたものとして最も適切なのはどれか。",
        choices: [
          "羊毛 ＞ ナイロン ＞ アクリル",
          "羊毛 ＞ アクリル ＞ ナイロン",
          "ナイロン ＞ 羊毛 ＞ アクリル",
          "アクリル ＞ ナイロン ＞ 羊毛"
        ],
        answer: 0,
        explanation: "正解は『羊毛 ＞ ナイロン ＞ アクリル』。羊毛は吸湿性が非常に高い天然繊維であり、アクリルは比較的吸湿性が低い点を押さえます。"
      },
      {
        year: 2020,
        sourceQuestion: "問2-D",
        field: "引張特性",
        question: "初期引張抵抗度とは、繊維の荷重－伸長曲線のどの値を指すか。",
        choices: [
          "切断時の荷重",
          "切断時の伸び率",
          "原点付近の接線の勾配"
        ],
        answer: 2,
        explanation: "正解は『原点付近の接線の勾配』。初期引張抵抗度は、糸や布の“こし”や“硬さ感”にも関係する重要項目です。"
      },
      {
        year: 2020,
        sourceQuestion: "問2-E",
        field: "耐熱性",
        question: "ナイロン・ポリエステル・ポリプロピレンを、融解温度の高い順に並べたものとして最も適切なのはどれか。",
        choices: [
          "ナイロン ＞ ポリプロピレン ＞ ポリエステル",
          "ナイロン ＞ ポリエステル ＞ ポリプロピレン",
          "ポリエステル ＞ ナイロン ＞ ポリプロピレン",
          "ポリプロピレン ＞ ポリエステル ＞ ナイロン"
        ],
        answer: 2,
        explanation: "正解は『ポリエステル ＞ ナイロン ＞ ポリプロピレン』。TESでは融解温度＝耐熱性の比較問題が頻出です。"
      },
      {
        year: 2020,
        sourceQuestion: "問3-A",
        field: "高分子",
        question: "高分子化合物において、構成するモノマーの繰り返し数を何と呼ぶか。",
        choices: ["ポリマー分子量", "重合度", "結晶化度"],
        answer: 1,
        explanation: "正解は『重合度』。モノマーが何個つながっているかを示す考え方です。分子量や結晶化度とは区別して押さえます。"
      },
      {
        year: 2020,
        sourceQuestion: "問3-B",
        field: "綿",
        question: "綿は、綿植物のどの部分から採取した繊維か。",

    let current = 0;
    let score = 0;
    let selectedMode = "2020年 問1";
    let answered = false;

    const screens = ["home", "yearSelect", "quiz", "result"];

    function showScreen(id) {
      screens.forEach(screen => document.getElementById(screen).classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      showScreen("home");
    }

    function showYearSelect() {
      showScreen("yearSelect");
    }

    function startQuiz(mode) {
      selectedMode = mode.includes('2020') ? mode : '2020年 問1';
      current = 0;
      score = 0;
      answered = false;
      showScreen("quiz");
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = questions[current];
      document.getElementById("modeLabel").textContent = selectedMode;
      document.getElementById("countLabel").textContent = `${current + 1} / ${questions.length}`;
      document.getElementById("progress").style.width = `${((current + 1) / questions.length) * 100}%`;
      document.getElementById("yearPill").textContent = q.year;
      document.getElementById("fieldPill").textContent = q.field;
      document.getElementById("questionText").textContent = q.question;
      document.getElementById("feedback").classList.add("hidden");
      document.getElementById("nextBtn").classList.add("hidden");

      const choices = document.getElementById("choices");
      choices.innerHTML = "";
      q.choices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.onclick = () => answerQuestion(index);
        btn.innerHTML = `<span class="choice-mark">${String.fromCharCode(65 + index)}</span><span>${choice}</span>`;
        choices.appendChild(btn);
      });
    }

    function answerQuestion(index) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const isCorrect = index === q.answer;
      if (isCorrect) score++;

      const choiceButtons = document.querySelectorAll(".choice");
      choiceButtons.forEach((btn, i) => {
        if (i === q.answer) btn.classList.add("correct");
        if (i === index && !isCorrect) btn.classList.add("wrong");
      });

      const feedback = document.getElementById("feedback");
      feedback.classList.remove("hidden");
      feedback.innerHTML = `
        <h3>${isCorrect ? "⭕ 正解です" : "❌ 惜しいです"}</h3>
        <p>${q.explanation}</p>
      `;
      document.getElementById("nextBtn").classList.remove("hidden");
    }

    function nextQuestion() {
      if (current < questions.length - 1) {
        current++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const total = questions.length;
      const rate = Math.round((score / total) * 100);
      document.getElementById("scoreText").textContent = `${score} / ${total}`;
      document.getElementById("totalNum").textContent = total;
      document.getElementById("correctNum").textContent = score;
      document.getElementById("rateNum").textContent = `${rate}%`;
      document.getElementById("resultNote").textContent = rate >= 80
        ? "かなり良い仕上がりです。次は解説を読んで知識を固めましょう。"
        : "間違えた問題を中心に復習すると、得点が安定します。";
      showScreen("result");
    }

    function restartQuiz() {
      startQuiz(selectedMode);
    }
