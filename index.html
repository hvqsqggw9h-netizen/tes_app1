<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TES 科目1 学習アプリ</title>

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --primary:#2563eb;
      --primary-soft:#dbeafe;
      --correct:#dcfce7;
      --correct-border:#22c55e;
      --wrong:#fee2e2;
      --wrong-border:#ef4444;
      --border:#e5e7eb;
      --shadow:0 18px 45px rgba(15,23,42,.08);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top right, #e0f7fa 0, transparent 34%),
        radial-gradient(circle at top left, #eef2ff 0, transparent 32%),
        var(--bg);
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:44px 22px 80px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:var(--primary-soft);
      color:var(--primary);
      font-weight:800;
      font-size:14px;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size:clamp(34px,6vw,56px);
      letter-spacing:-.04em;
      line-height:1.05;
    }

    .lead{
      margin:16px 0 34px;
      color:var(--muted);
      font-size:18px;
      line-height:1.8;
    }

    .home-card,
    .quiz-card,
    .finish-card{
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:30px;
    }

    .section-label{
      display:inline-flex;
      padding:8px 14px;
      border-radius:999px;
      background:var(--primary-soft);
      color:var(--primary);
      font-weight:800;
      font-size:14px;
      margin-bottom:18px;
    }

    .mode-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      margin-top:18px;
    }

    .mode{
      border:1px solid var(--border);
      background:#fff;
      border-radius:18px;
      padding:22px;
      text-align:left;
      cursor:pointer;
      transition:.18s ease;
      min-height:122px;
    }

    .mode:hover{
      transform:translateY(-2px);
      border-color:var(--primary);
      box-shadow:0 10px 24px rgba(37,99,235,.12);
    }

    .mode strong{
      display:block;
      font-size:20px;
      margin-bottom:10px;
      color:#111827;
    }

    .mode span{
      color:var(--muted);
      line-height:1.6;
      font-size:15px;
    }

    .hidden{ display:none !important; }

    .quiz-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:18px;
      color:var(--muted);
      font-weight:700;
    }

    .progress-track{
      height:12px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin-bottom:26px;
    }

    .progress-bar{
      height:100%;
      width:0%;
      background:var(--primary);
      border-radius:999px;
      transition:.25s ease;
    }

    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:22px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      padding:8px 13px;
      border-radius:999px;
      background:#f3f4f6;
      color:#374151;
      font-weight:800;
      font-size:14px;
    }

    .question-text{
      font-size:clamp(24px,4vw,38px);
      font-weight:900;
      line-height:1.55;
      letter-spacing:-.02em;
      margin:0 0 24px;
      color:#111827;
    }

    .question-image{
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      padding:14px;
      margin:18px 0 24px;
    }

    .question-image img{
      display:block;
      max-width:100%;
      max-height:520px;
      margin:0 auto;
      object-fit:contain;
      border-radius:14px;
    }

    .image-caption{
      margin:12px 4px 2px;
      color:var(--muted);
      font-size:15px;
      line-height:1.7;
    }

.question-jump{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 2px 18px;
  margin-bottom:10px;
  scrollbar-width:thin;
}

.jump-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:#fff;
  color:#374151;
  border-radius:999px;
  padding:8px 12px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:.15s ease;
}

.jump-btn:hover{
  border-color:var(--primary);
  color:var(--primary);
  background:#eff6ff;
}

.jump-btn.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

    .choices{
      display:grid;
      gap:14px;
    }

    .choice{
      display:flex;
      align-items:center;
      gap:16px;
      width:100%;
      border:1.5px solid var(--border);
      background:#fff;
      border-radius:20px;
      padding:18px 20px;
      cursor:pointer;
      text-align:left;
      font-size:20px;
      font-weight:800;
      line-height:1.5;
      transition:.15s ease;
    }

    .choice:hover{
      border-color:var(--primary);
      background:#f8fbff;
    }

    .choice:disabled{
      cursor:default;
      opacity:1;
    }

    .letter{
      width:38px;
      height:38px;
      border-radius:999px;
      background:#f3f4f6;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      font-size:16px;
      color:#374151;
    }

    .choice.correct{
      background:var(--correct);
      border-color:var(--correct-border);
    }

    .choice.wrong{
      background:var(--wrong);
      border-color:var(--wrong-border);
    }

    .feedback{
      margin-top:24px;
      background:#f8fafc;
      border:1px solid var(--border);
      border-radius:22px;
      padding:24px;
      line-height:1.8;
      font-size:18px;
    }

    .feedback h3{
      margin:0 0 10px;
      font-size:24px;
    }

    .feedback p{
      margin:0;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:24px;
    }

    .btn{
      border:0;
      border-radius:16px;
      padding:14px 20px;
      font-size:17px;
      font-weight:900;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-secondary{
      background:#fff;
      color:#1f2937;
      border:1px solid var(--border);
    }

    .finish-card h2{
      font-size:34px;
      margin:0 0 10px;
    }

    .finish-card p{
      color:var(--muted);
      font-size:18px;
      line-height:1.7;
    }

    @media(max-width:760px){
      .wrap{ padding:24px 14px 60px; }
      .home-card,.quiz-card,.finish-card{ padding:22px; border-radius:24px; }
      .mode-grid{ grid-template-columns:1fr; }
      .quiz-head{ align-items:flex-start; flex-direction:column; }
      .choice{ font-size:18px; padding:16px; }
      .question-image img{ max-height:420px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section id="home">
      <div class="badge">TES Learning App</div>
      <h1>科目1 繊維に関する一般知識</h1>
      <p class="lead">2020年度対応版。問題データは <strong>questions/2020.js</strong> から読み込む分割構造です。</p>

      <div class="home-card">
        <div class="section-label">STEP 1</div>
        <h2>学習モードを選択</h2>
        <p class="lead" style="margin-top:8px;">まずは年度別で通し学習。その後、ランダム・図解・苦手復習へ広げます。</p>

        <div class="mode-grid">
          <button class="mode" onclick="startQuiz('2020年 全問題')">
            <strong>2020年 全問題</strong>
            <span>問1〜問12を順番に確認します。</span>
          </button>
          <button class="mode" onclick="startQuiz('2020年 ランダム10問')">
            <strong>ランダム10問</strong>
            <span>全問題から10問だけランダム出題します。</span>
          </button>
          <button class="mode" onclick="startQuiz('2020年 図解問題')">
            <strong>図解問題だけ</strong>
            <span>画像付き問題を集中して復習します。</span>
          </button>
<button class="mode" onclick="startQuiz('2021年 全問題')">
  <strong>2021年 全問題</strong>
  <span>2021年度の問題を順番に確認します。</span>
</button>


<button class="mode" onclick="startQuiz('苦手問題')">
  <strong>苦手問題だけ</strong>
  <span>間違えた問題だけを復習します。</span>
</button>

        </div>
      </div>
    </section>

    <section id="quiz" class="hidden">
      <div class="quiz-card">
        <div class="quiz-head">
          <span id="modeLabel">2020年</span>
          <span id="countLabel">1 / 1</span>
        </div>

        <div class="progress-track">
          <div id="progress" class="progress-bar"></div>
        </div>

        <div class="chips">
          <span id="yearPill" class="chip">2020</span>
          <span id="fieldPill" class="chip">分野</span>
          <span id="sourcePill" class="chip">問</span>
        </div>

<div id="questionJump" class="question-jump"></div>

        <p id="questionText" class="question-text"></p>

        <div id="questionImage" class="question-image hidden"></div>

        <div id="choices" class="choices"></div>

        <div id="feedback" class="feedback hidden"></div>

        <div class="actions">
          <button id="nextBtn" class="btn btn-primary hidden" onclick="nextQuestion()">次の問題へ</button>
          <button class="btn btn-secondary" onclick="goHome()">ホームへ戻る</button>
        </div>
      </div>
    </section>

    <section id="finish" class="hidden">
      <div class="finish-card">
        <h2>学習完了！</h2>
        <p id="scoreText"></p>
        <div class="actions">
          <button class="btn btn-primary" onclick="goHome()">ホームへ戻る</button>
          <button class="btn btn-secondary" onclick="startQuiz(selectedMode)">もう一度</button>
        </div>
      </div>
    </section>
  </main>

  <script src="questions/2020.js"></script>
<script src="questions/2021.js"></script>

<script src="validator.js"></script>

  <script>
    let currentQuestions = [];
    let current = 0;
    let score = 0;
    let selectedMode = "2020年 全問題";
    let answered = false;


const WRONG_KEY = "tesWrongQuestions";

function getQuestionId(q){
  return `${q.year}-${q.sourceQuestion}`;
}

function loadWrongIds(){
  try{
    return JSON.parse(localStorage.getItem(WRONG_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveWrongId(q){
  const id = getQuestionId(q);
  const ids = loadWrongIds();
  if(!ids.includes(id)){
    ids.push(id);
    localStorage.setItem(WRONG_KEY, JSON.stringify(ids));
  }
}

function removeWrongId(q){
  const id = getQuestionId(q);
  const ids = loadWrongIds().filter(savedId => savedId !== id);
  localStorage.setItem(WRONG_KEY, JSON.stringify(ids));
}

function getAllQuestions(){
  return [
    ...(window.questions2020 || []),
    ...(window.questions2021 || [])
  ];
}

function getWrongQuestions(){
  const ids = loadWrongIds();
  return getAllQuestions().filter(q => ids.includes(getQuestionId(q)));
}


    function showScreen(id){
      document.getElementById("home").classList.add("hidden");
      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("finish").classList.add("hidden");
      document.getElementById(id).classList.remove("hidden");
    }

    function shuffleArray(array){
      const copied = [...array];
      for(let i = copied.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

function startQuiz(mode){
  selectedMode = mode || "2020年 全問題";
  current = 0;
  score = 0;
  answered = false;

/*
function startQuiz(mode){
  selectedMode = mode || "2020年 全問題";
  current = 0;
  score = 0;
  answered = false;

  // --- 苦手問題モード ---
  if(selectedMode === "苦手問題"){
    currentQuestions = getWrongQuestions();

    if(currentQuestions.length === 0){
      alert("現在、苦手問題はありません。間違えた問題がここに保存されます。");
      return;
    }

    showScreen("quiz");
    renderQuestionJump();
    renderQuestion();
    return;
  }

  let allQuestions = [];

  // --- 年度切替 ---
  if(selectedMode.includes("2020")){
    allQuestions = [...window.questions2020];
  }
  else if(selectedMode.includes("2021")){
    allQuestions = [...window.questions2021];
  }

  // --- 出題モード切替 ---
  if(selectedMode.includes("ランダム")){
    currentQuestions = shuffleArray(allQuestions).slice(0, 10);
  }
  else if(selectedMode.includes("図解")){
    currentQuestions = allQuestions.filter(q => q.image);
  }
  else{
    currentQuestions = [...allQuestions];
  }

  if(currentQuestions.length === 0){
    alert("問題データが読み込めていません。");
    return;
  }

  showScreen("quiz");
  renderQuestionJump();
  renderQuestion();
}

  let allQuestions = [];

  // ここから下は既存の年度切替処理
}
*/

  // --- 年度切替 ---
  if(selectedMode.includes("2020")){
    allQuestions = [...window.questions2020];
  }
  else if(selectedMode.includes("2021")){
    allQuestions = [...window.questions2021];
  }

  // --- 出題モード切替 ---
  if(selectedMode.includes("ランダム")){
    currentQuestions = shuffleArray(allQuestions).slice(0, 10);
  }
  else if(selectedMode.includes("図解")){
    currentQuestions = allQuestions.filter(q => q.image);
  }
  else{
    currentQuestions = [...allQuestions];
  }

  if(currentQuestions.length === 0){
    alert("問題データが読み込めていません。");
    return;
  }

  showScreen("quiz");
  renderQuestionJump();
  renderQuestion();
}
function renderQuestionJump(){
  const jump = document.getElementById("questionJump");
  if(!jump) return;

  jump.innerHTML = currentQuestions.map((q, index) => `
    <button class="jump-btn ${index === current ? "active" : ""}" onclick="jumpToQuestion(${index})">
      ${q.sourceQuestion}
    </button>
  `).join("");
}

function jumpToQuestion(index){
  current = index;
  renderQuestion();
}

    function renderQuestion(){
      answered = false;
      const q = currentQuestions[current];

      document.getElementById("modeLabel").textContent = selectedMode;
      document.getElementById("countLabel").textContent = `${current + 1} / ${currentQuestions.length}`;
      document.getElementById("progress").style.width = `${((current + 1) / currentQuestions.length) * 100}%`;
      document.getElementById("yearPill").textContent = q.year;
      document.getElementById("fieldPill").textContent = q.field;
      document.getElementById("sourcePill").textContent = q.sourceQuestion;
      document.getElementById("questionText").textContent = q.question;
renderQuestionJump();

      const imageBox = document.getElementById("questionImage");
      if(q.image && q.showImageBeforeAnswer){
        imageBox.classList.remove("hidden");
        imageBox.innerHTML = `<img src="${q.image}" alt="${q.imageAlt || q.sourceQuestion}"><p class="image-caption">${q.imageCaption || "問題図です。"}</p>`;
      }else{
        imageBox.classList.add("hidden");
        imageBox.innerHTML = "";
      }

      const feedback = document.getElementById("feedback");
      feedback.classList.add("hidden");
      feedback.innerHTML = "";
      document.getElementById("nextBtn").classList.add("hidden");

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      q.choices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${choice}</span>`;
        btn.onclick = () => answer(index);
        choices.appendChild(btn);
      });
    }

    function answer(selectedIndex){
      if(answered) return;
      answered = true;

      const q = currentQuestions[current];
const isCorrect = selectedIndex === q.answer;

if(isCorrect){
  score++;
  removeWrongId(q);
}else{
  saveWrongId(q);
}


/*
if(isCorrect){
  score++;
  removeWrongId(q); // 正解できたら苦手から外す
}else{
  saveWrongId(q);   // 間違えたら苦手に保存
}
*/

      const buttons = document.querySelectorAll(".choice");
      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if(index === q.answer) btn.classList.add("correct");
        if(index === selectedIndex && !isCorrect) btn.classList.add("wrong");
      });

  // --- detail表示対応パッチ ---
// index.html の answer(selectedIndex) 関数内で、
// feedback.innerHTML = ... の直前あたりをこの内容に差し替えてください。

const imageHtml = q.image && !q.showImageBeforeAnswer
  ? `<div class="question-image" style="margin-top:16px;">
      <img src="${q.image}" alt="${q.imageAlt || q.sourceQuestion}">
      <p class="image-caption">${q.imageCaption || "理解を助ける補助図です。"}</p>
    </div>`
  : "";

const detailHtml = q.detail ? `
  <div style="margin-top:18px; display:grid; gap:12px;">
    <div style="background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px;">
      <strong>① 正解</strong>
      <p>${q.detail.answer}</p>
    </div>

    <div style="background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px;">
      <strong>② なぜそうなるか</strong>
      <p>${q.detail.reason}</p>
    </div>

    <div style="background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px;">
      <strong>③ 間違えやすい比較</strong>
      <p>${q.detail.compare}</p>
    </div>

    <div style="background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px;">
      <strong>④ 現場イメージ</strong>
      <p>${q.detail.practical}</p>
    </div>

    <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:16px; padding:16px;">
      <strong>⑤ 一言暗記</strong>
      <p>${q.detail.memory}</p>
    </div>
  </div>
` : `<p>${q.explanation}</p>`;

feedback.classList.remove("hidden");
feedback.innerHTML = `
  <h3>${isCorrect ? "⭕ 正解です" : "❌ 惜しいです"}</h3>
  ${detailHtml}
  ${imageHtml}
`;

  document.getElementById("nextBtn").classList.remove("hidden");
}
    function nextQuestion(){
      if(current < currentQuestions.length - 1){
        current++;
        renderQuestion();
      }else{
        finishQuiz();
      }
    }

    function finishQuiz(){
      document.getElementById("scoreText").textContent = `${currentQuestions.length}問中 ${score}問 正解です。`;
      showScreen("finish");
    }

    function goHome(){
      showScreen("home");
    }
  </script>
</body>
</html>
